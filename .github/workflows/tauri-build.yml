name: Tauri build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Remove quarantine attributes
        run: |
          xattr -cr src-tauri/target/release/bundle/dmg/
          xattr -cr src-tauri/target/release/bundle/macos/

      - name: Zip macOS app
        run: |
          cd src-tauri/target/release/bundle/macos
          zip -r ../phitodo-macos.zip .
          cd -

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phitodo-dmg
          path: src-tauri/target/release/bundle/dmg/

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: phitodo-macos-app
          path: src-tauri/target/release/bundle/macos/

      - name: Set release file paths
        id: release_files
        run: |
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          echo "dmg=$DMG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.release_files.outputs.dmg }}
            src-tauri/target/release/bundle/phitodo-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
